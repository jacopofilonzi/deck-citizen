# Check on every push and pull request; on a version tag (v1.2.3) also publish a release
# with the .streamDeckPlugin package. The tag decides the plugin version.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The plugin is Windows only (SendInput through koffi), so is the build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export PLUGIN_VERSION="${GITHUB_REF_NAME#v}"
          fi
          npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: streamDeckPlugin
          path: dist/*.streamDeckPlugin
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: streamDeckPlugin
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
